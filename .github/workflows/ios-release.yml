name: iOS Release

on:
  workflow_dispatch: {}
  push:
    branches:
      - release/**
      - hotfix/**

jobs:
  release:
    runs-on: macos-latest

    env:
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Write .env
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Export env vars
        run: |
          tr -d '\r' < .env | \
            awk '/^[[:space:]]*(export[[:space:]]+)?EXPO_PUBLIC_[A-Za-z0-9_]+=/ { sub(/^[[:space:]]*export[[:space:]]+/, "", $0); print $0; }' \
            >> "$GITHUB_ENV"

      - name: Set Expo environment
        run: |
          echo "EXPO_PUBLIC_ENV=prod" >> "$GITHUB_ENV"
          echo "APP_VARIANT=prod" >> "$GITHUB_ENV"

      - name: Validate Expo environment
        run: |
          if [ "$EXPO_PUBLIC_ENV" != "prod" ]; then
            echo "EXPO_PUBLIC_ENV must be 'prod' (got '$EXPO_PUBLIC_ENV')" >&2
            exit 1
          fi
          if [ "${EXPO_PUBLIC_MYCHAMPIONS_SERVER_URL:-}" != "https://api.mychampions.eduwaldo.com" ]; then
            echo "EXPO_PUBLIC_MYCHAMPIONS_SERVER_URL must be https://api.mychampions.eduwaldo.com for production builds" >&2
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID:-}" ]; then
            echo "EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID must be configured for production builds" >&2
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID:-}" ]; then
            echo "EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID must be configured for native Google sign-in" >&2
            exit 1
          fi
          python3 <<'PY'
          import json
          import os
          import plistlib

          with open('config/google-oauth-production.json', encoding='utf-8') as source:
              oauth = json.load(source)

          ios_client_id = os.environ['EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID']
          web_client_id = os.environ['EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID']
          if ios_client_id != oauth['ios']['clientId']:
              raise SystemExit('iOS Google OAuth client does not match production provider metadata')
          if web_client_id != oauth['webClientId']:
              raise SystemExit('Google OAuth web client does not match production provider metadata')

          suffix = '.apps.googleusercontent.com'
          if not ios_client_id.endswith(suffix):
              raise SystemExit('iOS Google OAuth client has an invalid client ID suffix')
          callback_scheme = oauth['ios']['callbackScheme']
          if not callback_scheme.endswith(ios_client_id[:-len(suffix)]):
              raise SystemExit('iOS Google OAuth callback does not match production provider metadata')

          with open('ios/mychampions/Info.plist', 'rb') as source:
              info = plistlib.load(source)
          callback_schemes = {
              scheme
              for url_type in info.get('CFBundleURLTypes', [])
              for scheme in url_type.get('CFBundleURLSchemes', [])
          }
          if callback_scheme not in callback_schemes:
              raise SystemExit('Info.plist is missing the configured Google OAuth callback scheme')
          PY
          case "${EXPO_PUBLIC_REVENUECAT_API_KEY_IOS_PROD:-}" in
            appl_*) ;;
            *)
              echo "EXPO_PUBLIC_REVENUECAT_API_KEY_IOS_PROD must be an appl_* public RevenueCat key" >&2
              exit 1
              ;;
          esac
          echo "EXPO_PUBLIC_ENV=$EXPO_PUBLIC_ENV"
      - name: Bump iOS build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" ios/mychampions/Info.plist

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install JS deps
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Install pods
        env:
          COCOAPODS_CACHE_DIR: ${{ runner.temp }}/.cocoapods-cache
        run: |
          mkdir -p "$COCOAPODS_CACHE_DIR"
          cd ios
          pod install --silent
      - name: Set up keychain and certificates
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          # Paths
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"

          # Decode certificate and profile
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Create and unlock keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" \
            -P "$CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow Xcode tools to use the key without UI
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Use this keychain for the build
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/mychampions.mobileprovision"

      - name: Validate provisioning profile entitlements
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/mychampions.mobileprovision"
          if [ ! -f "$PROFILE_PATH" ]; then
            echo "Provisioning profile not found at $PROFILE_PATH" >&2
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)
          APPLE_SIGN_IN=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin:0" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)

          if [ -z "$APS_ENV" ]; then
            echo "Provisioning profile missing Push Notifications entitlement (aps-environment)." >&2
            exit 1
          fi

          if [ "$APS_ENV" != "production" ]; then
            echo "Provisioning profile aps-environment is '$APS_ENV' but Release builds require 'production'." >&2
            exit 1
          fi

          if [ "$APPLE_SIGN_IN" != "Default" ]; then
            echo "Provisioning profile missing Sign in with Apple entitlement (expected Default)." >&2
            exit 1
          fi

      - name: Build archive
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          cd ios
          xcodebuild \
            -workspace mychampions.xcworkspace \
            -scheme mychampions \
            -configuration Release \
            -archivePath "$PWD/build/mychampions.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="com.edufelip.mychampions" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export IPA
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edufelip.mychampions</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          cd ios
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/mychampions.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.private_keys"
          KEY_FILE="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 -d > "$KEY_FILE"
          ls -l ios/build

          IPA_PATH=$(ls ios/build/*.ipa | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found in ios/build" && exit 1
          fi

          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mychampions.ipa
          path: ios/build/*.ipa
          retention-days: 1

      - name: Clean keychain and profiles
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
