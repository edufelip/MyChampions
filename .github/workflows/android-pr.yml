name: Android PR Checks

on:
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
        working-directory: .
      - name: Set app variant
        run: echo "APP_VARIANT=dev" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install JS deps
        run: yarn install --frozen-lockfile
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set CI version code
        run: echo "CI_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
      - name: Run Android lint, unit tests, and debug build
        run: |
          ./gradlew \
            lintDevDebug \
            testDevDebugUnitTest \
            assembleDevDebug \
            --no-build-cache
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-reports-${{ github.run_id }}
          path: android/app/build/reports
          if-no-files-found: warn
          retention-days: 1
