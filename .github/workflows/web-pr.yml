name: Web build validation

on:
  workflow_dispatch:

jobs:
  export-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --no-progress
      - id: backend-contract-ref
        name: Resolve coordinated backend contract ref
        env:
          MOBILE_HEAD_REF: ${{ github.head_ref }}
        run: |
          backend_ref="${MOBILE_HEAD_REF:-main}"
          if ! git ls-remote --exit-code --heads https://github.com/edufelip/mychampions-api.git "refs/heads/${backend_ref}" >/dev/null; then
            backend_ref=main
          fi
          echo "ref=${backend_ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: edufelip/mychampions-api
          ref: ${{ steps.backend-contract-ref.outputs.ref }}
          path: node_modules/.ci-my-champions-api
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Install coordinated backend dependencies
        working-directory: node_modules/.ci-my-champions-api
        run: bun install --frozen-lockfile
      - run: yarn test:unit
        env:
          MYCHAMPIONS_SERVER_APP_PATH: node_modules/.ci-my-champions-api/src/app.ts
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn web:export
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn test:e2e:web
      - name: Run server-backed browser session E2E
        timeout-minutes: 15
        env:
          MYCHAMPIONS_SERVER_ROOT: ${{ github.workspace }}/node_modules/.ci-my-champions-api
        run: yarn test:e2e:web:server
