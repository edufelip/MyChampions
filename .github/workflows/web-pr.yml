name: Web build validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'features/**'
      - 'hooks/**'
      - 'localization/**'
      - 'app.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - 'playwright.config.ts'
      - 'e2e/web/**'
      - 'scripts/run-web-e2e-batch.mjs'
      - '.github/workflows/web-pr.yml'

jobs:
  export-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --no-progress
      - run: yarn test:unit
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn web:export
      - uses: actions/upload-artifact@v4
        with:
          name: mychampions-web-export
          path: dist/web
          if-no-files-found: error
          retention-days: 7
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn test:e2e:web
