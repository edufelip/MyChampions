name: iOS PR Checks

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
      - name: Set Expo environment (dev)
        run: |
          echo "EXPO_PUBLIC_ENV=dev" >> "$GITHUB_ENV"
          echo "APP_VARIANT=dev" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install JS deps
        run: yarn install --frozen-lockfile
        working-directory: .
      - name: Install pods
        env:
          COCOAPODS_CACHE_DIR: ${{ runner.temp }}/.cocoapods-cache
        run: |
          mkdir -p "$COCOAPODS_CACHE_DIR"
          cd ios
          pod install --silent
      - name: List available simulators
        run: xcrun simctl list devices available
      - name: Build (simulator debug)
        run: |
          cd ios
          xcodebuild \
            -workspace mychampions.xcworkspace \
            -scheme mychampions \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Run Detox smoke
        run: yarn test:e2e:ios:debug:smoke
