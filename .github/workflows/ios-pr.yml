name: iOS PR Checks

on:
  workflow_dispatch:

jobs:
  resolve-ios-tests:
    name: Resolve iOS test toggle
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
    steps:
      - id: resolve
        name: Evaluate exact iOS test toggle value
        env:
          IOS_TESTS_VALUE: ${{ vars.MYCHAMPIONS_ENABLE_IOS_TESTS }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os

          enabled = os.environ.get("IOS_TESTS_VALUE", "") != "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
          PY

  build:
    needs: resolve-ios-tests
    if: ${{ needs.resolve-ios-tests.outputs.enabled == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Write .env
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
      - name: Set Expo environment (dev)
        run: |
          echo "EXPO_PUBLIC_ENV=dev" >> "$GITHUB_ENV"
          echo "APP_VARIANT=dev" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install JS deps
        run: yarn install --frozen-lockfile
        working-directory: .
      - name: Install pods
        env:
          COCOAPODS_CACHE_DIR: ${{ runner.temp }}/.cocoapods-cache
        run: |
          mkdir -p "$COCOAPODS_CACHE_DIR"
          cd ios
          pod install --silent
      - name: List available simulators
        run: xcrun simctl list devices available
      - name: Build (simulator debug)
        run: |
          cd ios
          xcodebuild \
            -workspace mychampions.xcworkspace \
            -scheme mychampions \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Run Detox smoke
        run: yarn test:e2e:ios:debug:smoke
