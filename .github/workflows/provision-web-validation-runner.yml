name: Provision web validation runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/provision-web-validation-runner.yml
      - scripts/ci/provision-web-validation-runner.sh

permissions:
  contents: read

concurrency:
  group: provision-mychampions-web-validation-runner
  cancel-in-progress: false

jobs:
  provision:
    name: Provision mychampions-web-only
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, mychampions-ci, mychampions-android]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install isolated web validation runner service
        env:
          ACTIONS_RUNNER_REGISTRATION_TOKEN: ${{ secrets.MYCHAMPIONS_WEB_RUNNER_REGISTRATION_TOKEN }}
        run: bash scripts/ci/provision-web-validation-runner.sh
