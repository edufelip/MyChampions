          import os

          path = os.environ["SECRET_FILE"]
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
          descriptor = os.open(path, flags, 0o600)
          try:
              payload = (os.environ["ENV_FILE_CONTENT"] + "\n").encode()
              while payload:
                  payload = payload[os.write(descriptor, payload):]
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
            unset ENV_FILE_CONTENT
            actual_mode="$(stat -c '%a' "$secret_file")" || return 1
            if [[ ! -f "$secret_file" || -L "$secret_file" || "$actual_mode" != "600" ]]; then
              echo "The per-step build secret target is not a mode-0600 regular file." >&2
              return 1
            fi
            ln -s "$secret_file" "$env_file"
            link_target="$(readlink "$env_file")" || return 1
            [[ -L "$env_file" && "$link_target" == "$secret_file" ]]
