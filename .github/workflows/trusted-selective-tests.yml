            "$simulator_name" "$device_type_id" "$runtime_id" > "$create_output"
          IFS= read -r simulator_udid < "$create_output"
          rm -f "$create_output"
          if [[ ! "$simulator_udid" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "simctl returned an invalid simulator UDID." >&2
            exit 1
          fi
          persist_ios_udid
          export DETOX_IOS_SIMULATOR_UDID="$simulator_udid"
          printf '%s\n' "### Job-owned iOS simulator" "" \
            "- Device: \`iPhone 17\`" \
            "- Runtime: \`$runtime_version\`" \
            "- UDID: \`$simulator_udid\`" >> "$GITHUB_STEP_SUMMARY"

