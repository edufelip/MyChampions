              return 1
            fi
          }
          create_secret_link() {
            local actual_mode link_target
            recover_stale_secret_link
            if [[ -e "$secret_file" || -L "$secret_file" ]]; then
              echo "The per-step build secret target already exists." >&2
              return 1
            fi
