                "$launch_candidate" =~ ^[0-9]+$ &&
                "$launch_candidate" != "$supervisor_previous_background_pid"
              ]]; then
                supervised_pid="$launch_candidate"
                supervised_pgid="$launch_candidate"
                for _ in $(seq 1 5); do
                  supervised_process_group_exists && break
                  kill -0 "$supervised_pid" 2>/dev/null || break
                  sleep 0.02
                done
              fi
            fi
            if supervised_process_group_exists; then
              kill -TERM -- "-$supervised_pgid" 2>/dev/null || true
              for _ in $(seq 1 15); do
                supervised_process_group_exists || break
                sleep 0.1
              done
              if supervised_process_group_exists; then
                kill -KILL -- "-$supervised_pgid" 2>/dev/null || terminate_status=1
