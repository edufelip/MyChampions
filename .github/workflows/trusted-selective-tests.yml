              link_target="$(readlink "$env_file")" || {
                link_target=
                cleanup_status=1
              }
              if [[ "$link_target" != "$secret_file" ]]; then
                echo "The workspace environment symlink no longer targets this build secret." >&2
                cleanup_status=1
              fi
              rm -f "$env_file" || cleanup_status=1
            elif [[ -e "$env_file" ]]; then
              echo "The workspace environment path is not the expected symlink." >&2
              cleanup_status=1
            fi
            if [[ -e "$secret_file" || -L "$env_file" ]]; then
              cleanup_status=1
            fi
            return "$cleanup_status"
          }
          recover_stale_secret_link() {
            local stale_target=
            if [[ -L "$env_file" ]]; then
              stale_target="$(readlink "$env_file")" || return 1
              case "$stale_target" in
                "$RUNNER_TEMP"/mychampions-env-*-android-build.env)
