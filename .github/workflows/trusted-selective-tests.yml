          supervised_process_group_exists() {
            [[ "$supervised_pgid" =~ ^[0-9]+$ ]] || return 1
            kill -0 -- "-$supervised_pgid" 2>/dev/null
          }
          capture_last_background_pid() {
            set +u
            captured_background_pid=$!
            set -u
