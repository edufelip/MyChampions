          create_secret_link() {
            local actual_mode link_target
            recover_stale_secret_link
            if [[ -e "$secret_file" || -L "$secret_file" ]]; then
              echo "The per-step secret target already exists." >&2
              return 1
            fi
            SECRET_FILE="$secret_file" /usr/bin/python3 - <<'PY'
          import os

          path = os.environ["SECRET_FILE"]
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(path, flags, 0o600)
          try:
              payload = (os.environ["ENV_FILE_CONTENT"] + "\n").encode()
              while payload:
                  payload = payload[os.write(descriptor, payload):]
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
            unset ENV_FILE_CONTENT
            actual_mode="$(stat -f '%Lp' "$secret_file")" || return 1
            if [[ ! -f "$secret_file" || -L "$secret_file" || "$actual_mode" != "600" ]]; then
              echo "The per-step secret target is not a mode-0600 regular file." >&2
              return 1
            fi
            ln -s "$secret_file" "$env_file"
            link_target="$(readlink "$env_file")" || return 1
            [[ -L "$env_file" && "$link_target" == "$secret_file" ]]
          }
          supervised_process_group_exists() {
            [[ "$supervised_pgid" =~ ^[0-9]+$ ]] || return 1
            kill -0 -- "-$supervised_pgid" 2>/dev/null
          }
          capture_last_background_pid() {
            set +u
            captured_background_pid=$!
            set -u
          }
          supervised_child_is_owned() {
            local process_group
            [[
              "$supervised_pid" =~ ^[0-9]+$ &&
              "$supervised_pgid" =~ ^[0-9]+$
            ]] || return 1
            kill -0 "$supervised_pid" 2>/dev/null || return 1
            process_group="$(
              ps -o pgid= -p "$supervised_pid" 2>/dev/null | tr -d '[:space:]'
            )" || return 1
