        with:
          name: mychampions-ios-failure-${{ github.run_id }}
          path: .artifacts/ci-diagnostics/ios
          if-no-files-found: warn
          retention-days: 1

  detox-android-selected:
    name: Selected Android Detox suites
    needs:
      - authorize-candidate
