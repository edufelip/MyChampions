              child_status=0
            else
              child_status=$?
            fi
            if supervised_process_group_exists; then
              terminate_supervised_child || {
                [[ "$child_status" -eq 0 ]] && child_status=1
              }
            else
              supervised_pid=
              supervised_pgid=
            fi
            return "$child_status"
          }
          persist_ios_intent() {
            /usr/bin/python3 - \
              "$ios_state_file" \
              "$simulator_name" \
              "$device_type_id" \
              "$runtime_id" <<'PY'
          import os
          import pathlib
          import sys

          state_path = pathlib.Path(sys.argv[1])
          directory_fd = os.open(
              state_path.parent,
              os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
          )
          values = {
              "version": "1",
              "phase": "intent",
              "name": sys.argv[2],
              "device_type": sys.argv[3],
              "runtime": sys.argv[4],
              "udid": "",
          }
          temporary_name = f".{state_path.name}.{os.getpid()}.tmp"
          try:
              os.stat(
                  state_path.name,
                  dir_fd=directory_fd,
                  follow_symlinks=False,
              )
          except FileNotFoundError:
              pass
          else:
              raise SystemExit("iOS recovery state already exists")
          descriptor = os.open(
              temporary_name,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
              0o600,
              dir_fd=directory_fd,
          )
          try:
              with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                  for key, value in values.items():
                      handle.write(f"{key}={value}\n")
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(
                  temporary_name,
                  state_path.name,
                  src_dir_fd=directory_fd,
                  dst_dir_fd=directory_fd,
              )
              os.fsync(directory_fd)
          finally:
              try:
                  os.unlink(temporary_name, dir_fd=directory_fd)
              except FileNotFoundError:
                  pass
              os.close(directory_fd)
          PY
          }
          persist_ios_udid() {
            /usr/bin/python3 - "$ios_state_file" "$simulator_udid" <<'PY'
          import os
          import pathlib
          import re
          import stat
          import sys

          state_path = pathlib.Path(sys.argv[1])
          udid = sys.argv[2]
          if re.fullmatch(
              r"[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}",
              udid,
          ) is None:
              raise SystemExit("Invalid simulator UUID")
          directory_fd = os.open(
              state_path.parent,
              os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
          )
          state_fd = os.open(
              state_path.name,
              os.O_RDONLY | os.O_NOFOLLOW,
              dir_fd=directory_fd,
          )
          metadata = os.fstat(state_fd)
          if (
              not stat.S_ISREG(metadata.st_mode)
              or stat.S_IMODE(metadata.st_mode) != 0o600
              or metadata.st_uid != os.getuid()
          ):
              raise SystemExit("Unsafe iOS recovery state")
          with os.fdopen(state_fd, encoding="utf-8") as state_handle:
              state_lines = state_handle.read().splitlines()
          values = {}
          for line in state_lines:
              key, separator, value = line.partition("=")
              if not separator or key in values:
                  raise SystemExit("Invalid iOS recovery state")
              values[key] = value
          if (
              set(values)
              != {
                  "version",
                  "phase",
                  "name",
                  "device_type",
                  "runtime",
                  "udid",
              }
              or values.get("version") != "1"
              or values.get("phase") != "intent"
              or values.get("udid") != ""
          ):
              raise SystemExit("Unexpected iOS recovery phase")
          values["phase"] = "created"
          values["udid"] = udid
          temporary_name = f".{state_path.name}.{os.getpid()}.tmp"
          descriptor = os.open(
              temporary_name,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
              0o600,
              dir_fd=directory_fd,
          )
          try:
              with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                  for key in (
                      "version",
                      "phase",
                      "name",
                      "device_type",
                      "runtime",
                      "udid",
                  ):
                      handle.write(f"{key}={values[key]}\n")
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(
                  temporary_name,
                  state_path.name,
                  src_dir_fd=directory_fd,
                  dst_dir_fd=directory_fd,
              )
              os.fsync(directory_fd)
          finally:
              try:
                  os.unlink(temporary_name, dir_fd=directory_fd)
              except FileNotFoundError:
                  pass
              os.close(directory_fd)
          PY
          }
          recover_ios_ledger() {
            local recovery_mode="$1"
            local -a recovery_runner
            if [[ "$recovery_mode" == "normal" ]]; then
              recovery_runner=(run_supervised /usr/bin/python3)
            else
              recovery_runner=(/usr/bin/python3)
            fi
            "${recovery_runner[@]}" - \
              "$ios_state_file" \
              "$recovery_mode" <<'PY'
          import json
          import os
          import pathlib
          import re
          import stat
          import subprocess
          import sys

          state_path = pathlib.Path(sys.argv[1])
          mode = sys.argv[2]
          if mode not in {"normal", "fast"}:
              raise SystemExit("Invalid iOS recovery mode")
          directory_fd = os.open(
              state_path.parent,
              os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
          )
          try:
              state_fd = os.open(
                  state_path.name,
                  os.O_RDONLY | os.O_NOFOLLOW,
                  dir_fd=directory_fd,
              )
          except FileNotFoundError:
              os.close(directory_fd)
              raise SystemExit(0)
          metadata = os.fstat(state_fd)
          if (
              not stat.S_ISREG(metadata.st_mode)
              or stat.S_IMODE(metadata.st_mode) != 0o600
              or metadata.st_uid != os.getuid()
          ):
              raise SystemExit("Unsafe iOS recovery state")
          with os.fdopen(state_fd, encoding="utf-8") as state_handle:
              state_lines = state_handle.read().splitlines()
          values = {}
          for line in state_lines:
              key, separator, value = line.partition("=")
              if not separator or key in values:
                  raise SystemExit("Invalid iOS recovery state")
              values[key] = value
          expected_keys = {
              "version",
              "phase",
              "name",
              "device_type",
              "runtime",
              "udid",
          }
          uuid_re = re.compile(
              r"^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$"
          )
          if (
              set(values) != expected_keys
              or values["version"] != "1"
              or values["phase"] not in {"intent", "created"}
              or re.fullmatch(r"mychampions-ci-[0-9]+-[0-9]+", values["name"])
              is None
              or values["device_type"]
              != "com.apple.CoreSimulator.SimDeviceType.iPhone-17"
              or re.fullmatch(
                  r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-26-[0-9-]+",
                  values["runtime"],
              )
              is None
              or (
                  values["udid"] != ""
                  and uuid_re.fullmatch(values["udid"]) is None
              )
              or (values["phase"] == "intent") != (values["udid"] == "")
          ):
              raise SystemExit("Invalid iOS recovery state values")
          list_timeout = 0.1 if mode == "fast" else 5
          shutdown_timeout = 0.1 if mode == "fast" else 5
          delete_timeout = 0.2 if mode == "fast" else 10

          def devices():
              result = subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "--json"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=list_timeout,
              )
              payload = json.loads(result.stdout)
              all_devices = [
                  device
                  for records in payload.get("devices", {}).values()
                  for device in records
              ]
              return [
                  device
                  for runtime, records in payload.get("devices", {}).items()
                  for device in records
                  if runtime == values["runtime"]
                  and device.get("name") == values["name"]
                  and device.get("deviceTypeIdentifier")
                  == values["device_type"]
              ], [
                  device
                  for device in all_devices
                  if values["udid"]
                  and device.get("udid") == values["udid"]
              ], [
                  device
                  for device in all_devices
                  if device.get("name") == values["name"]
              ]

          matching, same_uuid, same_name = devices()
          if (
              len(matching) > 1
              or len(same_uuid) > 1
              or len(same_name) > 1
          ):
              raise SystemExit("Ambiguous iOS recovery identity")
          if values["udid"]:
              matching_uuid = [
                  device
                  for device in matching
                  if device.get("udid") == values["udid"]
              ]
              if (same_name and not matching_uuid) or (
                  same_uuid and not matching_uuid
              ):
                  raise SystemExit("Recovered iOS UUID changed identity")
              matching = matching_uuid
          elif same_name and not matching:
              raise SystemExit("Recovered iOS intent changed runtime or device type")
          if not matching:
              if same_uuid or same_name:
                  raise SystemExit("Recovered iOS UUID changed identity")
              if mode == "fast" and values["phase"] == "intent":
                  raise SystemExit(
                      "Retaining interrupted iOS create intent for next-run recovery"
                  )
              os.unlink(state_path.name, dir_fd=directory_fd)
              os.fsync(directory_fd)
              os.close(directory_fd)
              raise SystemExit(0)
          recovered_udid = str(matching[0].get("udid", ""))
          if uuid_re.fullmatch(recovered_udid) is None:
              raise SystemExit("Recovered iOS simulator has an invalid UUID")
          if not values["udid"]:
              values["phase"] = "created"
              values["udid"] = recovered_udid
              temporary_name = f".{state_path.name}.{os.getpid()}.tmp"
              temporary_fd = os.open(
                  temporary_name,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                  0o600,
                  dir_fd=directory_fd,
              )
              with os.fdopen(
                  temporary_fd,
                  "w",
                  encoding="utf-8",
              ) as handle:
                  for key in (
                      "version",
                      "phase",
                      "name",
                      "device_type",
                      "runtime",
                      "udid",
                  ):
                      handle.write(f"{key}={values[key]}\n")
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(
                  temporary_name,
                  state_path.name,
                  src_dir_fd=directory_fd,
                  dst_dir_fd=directory_fd,
              )
              os.fsync(directory_fd)
          for action, timeout in (
              ("shutdown", shutdown_timeout),
              ("delete", delete_timeout),
          ):
              try:
                  subprocess.run(
                      ["xcrun", "simctl", action, recovered_udid],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=timeout,
                  )
              except subprocess.TimeoutExpired:
                  pass
          matching, same_uuid, same_name = devices()
          if same_uuid or matching or same_name:
              raise SystemExit("Job-owned iOS simulator survived recovery")
          os.unlink(state_path.name, dir_fd=directory_fd)
          os.fsync(directory_fd)
          os.close(directory_fd)
          PY
          }
          cleanup_ios_resources() {
            local command_status=$?
            local cleanup_failed=false
            trap - EXIT
            trap '' INT TERM
            set +e

            remove_secret_material || cleanup_failed=true
            terminate_supervised_child || cleanup_failed=true
            recover_ios_ledger normal || cleanup_failed=true
            if [[ "$cleanup_failed" == "true" && "$command_status" -eq 0 ]]; then
              command_status=1
            fi
            exit "$command_status"
          }
          cleanup_ios_signal() {
            local signal_status="$1"
            trap - EXIT
            trap '' INT TERM
            set +e

            remove_secret_material || true
            terminate_supervised_child fast || true
            recover_ios_ledger fast || true
            exit "$signal_status"
          }
          validate_recovery_root
          trap cleanup_ios_resources EXIT
          trap 'cleanup_ios_signal 130' INT
          trap 'cleanup_ios_signal 143' TERM

          recover_ios_ledger normal

          rm -f "$device_types_output" "$runtimes_output"
          run_supervised xcrun simctl list devicetypes --json > "$device_types_output"
          device_type_id="$(
            /usr/bin/python3 -c '
          import json
          import sys

          expected_identifier = "com.apple.CoreSimulator.SimDeviceType.iPhone-17"
          matches = [
              device
              for device in json.load(sys.stdin).get("devicetypes", [])
              if device.get("name") == "iPhone 17"
              and device.get("identifier") == expected_identifier
          ]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one iPhone 17 simulator device type")
          print(matches[0]["identifier"])
          ' < "$device_types_output"
          )"
          run_supervised xcrun simctl list runtimes --json > "$runtimes_output"
          runtime_record="$(
            /usr/bin/python3 -c '
          import json
          import sys

          def version_key(runtime):
              return tuple(int(part) for part in runtime["version"].split("."))

          matches = [
              runtime
              for runtime in json.load(sys.stdin).get("runtimes", [])
              if runtime.get("isAvailable") is True
              and runtime.get("identifier", "").startswith(
                  "com.apple.CoreSimulator.SimRuntime.iOS-"
              )
              and runtime.get("version", "").split(".", 1)[0] == "26"
          ]
          if not matches:
              raise SystemExit("No available iOS 26 simulator runtime was found")
          selected = max(matches, key=version_key)
          print(selected["identifier"], selected["version"], sep="\t")
          ' < "$runtimes_output"
          )"
          IFS=$'\t' read -r runtime_id runtime_version <<<"$runtime_record"
          if [[
            "$device_type_id" != "com.apple.CoreSimulator.SimDeviceType.iPhone-17" ||
            "$runtime_id" != com.apple.CoreSimulator.SimRuntime.iOS-26-* ||
            "${runtime_version%%.*}" != "26"
          ]]; then
