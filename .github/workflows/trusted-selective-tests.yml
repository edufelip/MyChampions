          set -euo pipefail
          env_file="$GITHUB_WORKSPACE/.env"
          secret_file="$RUNNER_TEMP/mychampions-env-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-android-build.env"
          supervised_pid=
          supervised_pgid=
          supervisor_launching=false
          supervisor_previous_background_pid=
          captured_background_pid=
          remove_secret_material() {
            local cleanup_status=0
            local link_target=
            unset ENV_FILE_CONTENT
            rm -f "$secret_file" || cleanup_status=1
            if [[ -e "$secret_file" || -L "$secret_file" ]]; then
              echo "The exact per-step Android build secret survived cleanup." >&2
              cleanup_status=1
            fi
