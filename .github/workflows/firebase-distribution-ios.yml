name: iOS Firebase Distribution

on:
  workflow_dispatch: {}
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ios-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-distribution:
    runs-on: [self-hosted, macOS, ARM64, mychampions-ci, mychampions-ios]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner context is available to steps, but not job-level `env`.
      # Persist these paths for the following signing and cleanup steps.
      - name: Initialize ephemeral signing paths
        run: |
          echo "IOS_KEYCHAIN_PATH=$RUNNER_TEMP/mychampions-dev-signing.keychain-db" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$RUNNER_TEMP/mychampions-dev.mobileprovision" >> "$GITHUB_ENV"

      - name: Write development environment
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          umask 077
          printf '%s' "$ENV_FILE_CONTENT" > .env
          unset ENV_FILE_CONTENT

      - name: Export public environment
        run: |
          tr -d '\r' < .env | \
            awk '/^[[:space:]]*(export[[:space:]]+)?EXPO_PUBLIC_[A-Za-z0-9_]+=/ { sub(/^[[:space:]]*export[[:space:]]+/, "", $0); print $0; }' \
            >> "$GITHUB_ENV"

      - name: Set development variant
        run: |
          echo "EXPO_PUBLIC_ENV=dev" >> "$GITHUB_ENV"
          echo "APP_VARIANT=dev" >> "$GITHUB_ENV"

      - name: Validate development configuration
        run: |
          if [ "$EXPO_PUBLIC_ENV" != "dev" ]; then
            echo "EXPO_PUBLIC_ENV must be 'dev' (got '$EXPO_PUBLIC_ENV')" >&2
            exit 1
          fi
          case "${EXPO_PUBLIC_MYCHAMPIONS_SERVER_URL:-}" in
            ""|"https://api.mychampions.eduwaldo.com")
              echo "Development Firebase distribution requires a configured non-production MyChampions server URL." >&2
              exit 1
              ;;
          esac
          if [ -z "${EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID:-}" ] || [ -z "${EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID:-}" ]; then
            echo "Development Firebase distribution requires iOS and web Google OAuth client IDs." >&2
            exit 1
          fi
          case "${EXPO_PUBLIC_REVENUECAT_API_KEY_IOS_DEV:-}" in
            appl_*) ;;
            *)
              echo "EXPO_PUBLIC_REVENUECAT_API_KEY_IOS_DEV must be an appl_* public RevenueCat key." >&2
              exit 1
              ;;
          esac

      - name: Validate Firebase distribution credentials
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_IOS_DEV }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "FIREBASE_APP_ID_IOS_DEV is not set." >&2
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not set." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          python3 -c 'import json, sys; payload = json.load(open(sys.argv[1], encoding="utf-8")); assert payload.get("client_email")' "$RUNNER_TEMP/firebase-service-account.json"

      - name: Validate Ad Hoc signing credentials
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_ADHOC_KEYCHAIN_PASSWORD }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_ADHOC_PROFILE_NAME }}
          CERT_P12_BASE64: ${{ secrets.IOS_ADHOC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_ADHOC_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for required_name in IOS_KEYCHAIN_PASSWORD IOS_PROFILE_NAME CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!required_name}" ]; then
              echo "$required_name is not set." >&2
              exit 1
            fi
          done

      - name: Bump iOS build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" ios/mychampions/Info.plist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods dependencies
        env:
          COCOAPODS_CACHE_DIR: ${{ runner.temp }}/.cocoapods-cache
        run: |
          mkdir -p "$COCOAPODS_CACHE_DIR"
          cd ios
          pod install --silent

      - name: Set up Ad Hoc signing
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_ADHOC_KEYCHAIN_PASSWORD }}
          CERT_P12_BASE64: ${{ secrets.IOS_ADHOC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_ADHOC_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/mychampions-dev-certificate.p12"
          IOS_PROFILE_DESTINATION="$HOME/Library/MobileDevice/Provisioning Profiles/mychampions-dev.mobileprovision"
          umask 077
          printf '%s' "$CERT_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode -o "$IOS_PROFILE_PATH"

          security delete-keychain "$IOS_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$IOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$IOS_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          security list-keychain -d user -s "$IOS_KEYCHAIN_PATH"
          unset CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64

          mkdir -p "$(dirname "$IOS_PROFILE_DESTINATION")"
          cp "$IOS_PROFILE_PATH" "$IOS_PROFILE_DESTINATION"
          echo "IOS_PROFILE_DESTINATION=$IOS_PROFILE_DESTINATION" >> "$GITHUB_ENV"

      - name: Validate development provisioning profile
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          security cms -D -i "$IOS_PROFILE_DESTINATION" > "$RUNNER_TEMP/mychampions-dev-profile.plist"
          PROFILE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/mychampions-dev-profile.plist" 2>/dev/null || true)
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/mychampions-dev-profile.plist" 2>/dev/null || true)
          APPLE_SIGN_IN=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin:0" "$RUNNER_TEMP/mychampions-dev-profile.plist" 2>/dev/null || true)
          PROFILE_DEVICE_ID=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices:0" "$RUNNER_TEMP/mychampions-dev-profile.plist" 2>/dev/null || true)
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$RUNNER_TEMP/mychampions-dev-profile.plist" 2>/dev/null || true)
          if [[ "$PROFILE_APP_IDENTIFIER" != "$IOS_TEAM_ID.com.edufelip.mychampions.dev" ]]; then
            echo "Development profile does not match com.edufelip.mychampions.dev." >&2
            exit 1
          fi
          if [ "$PROFILE_TEAM_ID" != "$IOS_TEAM_ID" ]; then
            echo "Development profile team does not match IOS_TEAM_ID." >&2
            exit 1
          fi
          if [ "$APPLE_SIGN_IN" != "Default" ]; then
            echo "Development profile is missing the Sign in with Apple entitlement." >&2
            exit 1
          fi
          if [ -z "$PROFILE_DEVICE_ID" ]; then
            echo "Development profile is not an Ad Hoc profile with a registered tester device." >&2
            exit 1
          fi
          case "$GET_TASK_ALLOW" in
            false|NO|0) ;;
            *)
              echo "Development profile allows task attachment and is not valid for Ad Hoc distribution." >&2
              exit 1
              ;;
          esac

      - name: Build development archive
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_ADHOC_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios
          xcodebuild \
            -workspace mychampions.xcworkspace \
            -scheme mychampions \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/mychampionsDev.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_ENTITLEMENTS="mychampions/mychampions.entitlements" \
            PRODUCT_BUNDLE_IDENTIFIER="com.edufelip.mychampions.dev" \
            APP_DISPLAY_NAME="MyChampions Dev" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH"

      - name: Export Ad Hoc development IPA
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_ADHOC_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat <<EOF > ios/ExportOptionsAdHoc.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edufelip.mychampions.dev</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          cd ios
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/mychampionsDev.xcarchive" \
            -exportOptionsPlist ExportOptionsAdHoc.plist \
            -exportPath "$PWD/build" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH"

      - name: Resolve IPA path
        run: |
          IPA_PATH=$(find ios/build -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found in ios/build." >&2
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Write release notes
        run: git log -1 --pretty=%B > "$RUNNER_TEMP/firebase-release-notes.txt"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_IOS_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx --yes firebase-tools@15.30.0 appdistribution:distribute "$IPA_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "base-group" \
            --release-notes-file "$RUNNER_TEMP/firebase-release-notes.txt"

      - name: Clean generated credentials
        if: always()
        run: |
          security delete-keychain "$IOS_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f \
            "$GITHUB_WORKSPACE/.env" \
            "$IOS_PROFILE_PATH" \
            "$IOS_PROFILE_DESTINATION" \
            "$RUNNER_TEMP/mychampions-dev-certificate.p12" \
            "$RUNNER_TEMP/mychampions-dev-profile.plist" \
            "$RUNNER_TEMP/firebase-service-account.json" \
            "$RUNNER_TEMP/firebase-release-notes.txt" \
            "$GITHUB_WORKSPACE/ios/ExportOptionsAdHoc.plist"
