# One-time simulator setup (run by scripts/testing/maestro-device.sh): turn off
# "AutoFill Passwords and Passkeys". With it on, iOS fills a suggested strong
# password into both create-account password fields and clears them when a
# flow types, and its password-field helpers make hierarchy reads fail.
appId: com.apple.Preferences
---
- launchApp:
    stopApp: true
# Settings can reopen with its list scrolled down where an earlier flow left
# it (an app's own settings page opened from the app), so look upward first.
- scrollUntilVisible:
    element: "^General$"
    direction: UP
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element: "^General$"
    direction: DOWN
- tapOn: "^General$"
- scrollUntilVisible:
    element: "AutoFill.*Passwords.*"
    direction: DOWN
- tapOn: "AutoFill.*Passwords.*"
- extendedWaitUntil:
    visible:
      id: AutoFillToggle
    timeout: 15000
- runFlow:
    when:
      visible:
        id: AutoFillToggle
        checked: true
    commands:
      # The switch element spans its whole row and a centre tap hits the
      # label; tap the switch itself (top row, right edge).
      - tapOn:
          point: "85%,20%"
      - extendedWaitUntil:
          visible:
            id: AutoFillToggle
            checked: false
          timeout: 5000
- assertVisible:
    id: AutoFillToggle
    checked: false
- stopApp
