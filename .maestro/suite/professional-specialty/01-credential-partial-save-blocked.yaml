appId: com.edufelip.mychampions.dev
name: Professional specialty - opens add-specialty credential setup and blocks partial credential saves
tags: [professional]
---
- runFlow: ../common/launch-fresh.yaml
- runFlow: ../common/select-professional-role.yaml
- assertVisible:
    id: pro.specialty.pageTitle
- assertNotVisible:
    id: pro.specialty.error
- extendedWaitUntil:
    visible:
      id: pro.specialty.empty
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: pro.specialty.add.nutritionist
    timeout: 5000
- tapOn:
    id: pro.specialty.add.nutritionist
- extendedWaitUntil:
    visible:
      id: pro.specialty.credentialForm
    timeout: 5000
- assertVisible:
    id: pro.specialty.credential.registryId
- tapOn:
    id: pro.specialty.credential.registryId
- inputText: CRN-12345
- hideKeyboard
- scrollUntilVisible:
    element:
      id: pro.specialty.credential.authority
    direction: DOWN
- scrollUntilVisible:
    element:
      id: pro.specialty.credential.country
    direction: DOWN
- scrollUntilVisible:
    element:
      id: pro.specialty.credential.save
    direction: DOWN
- tapOn:
    id: pro.specialty.credential.save
- extendedWaitUntil:
    visible:
      id: pro.specialty.credential.error
    timeout: 5000
- scrollUntilVisible:
    element:
      id: pro.specialty.credential.skip
    direction: DOWN
- tapOn:
    id: pro.specialty.credential.skip
- extendedWaitUntil:
    visible:
      id: pro.specialty.row.nutritionist
    timeout: 5000
- assertVisible:
    id: pro.specialty.cta_continue
