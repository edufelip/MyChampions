appId: com.edufelip.mychampions.dev
name: Student self-managed builder - creates a self-managed nutrition plan and returns to the student nutrition context
tags: [student-self-managed-builder]
---
- runFlow:
    file: ../common/student-open-route.yaml
    env:
      ROUTE: mychampions://student/nutrition/plans/new
      SCREEN_ID: pro.nutrition_plan.screen
- tapOn:
    id: pro.plan.metadata.name
- inputText: E2E Student Nutrition Plan
- assertVisible:
    id: pro.plan.metadata.name
    text: E2E Student Nutrition Plan
- tapOn:
    id: pro.plan.metadata.hydrationGoalMl
- inputText: "2100"
- assertVisible:
    id: pro.plan.metadata.hydrationGoalMl
    text: "2100"
- hideKeyboard
- tapOn:
    id: pro.nutrition_plan.saveButton
- extendedWaitUntil:
    visible:
      id: student.nutrition.screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: student.nutrition.selfManagedPlanCard
    timeout: 10000
