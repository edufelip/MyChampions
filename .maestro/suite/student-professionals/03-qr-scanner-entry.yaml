appId: com.edufelip.mychampions.dev
name: Student professionals - handles QR scanner entry after camera permission is granted
tags: [qr-valid]
---
- runFlow: ../common/student-professionals.yaml
- tapOn:
    id: student.professionals.scanQrButton
- runFlow:
    file: ../common/answer-camera-prompt.yaml
    env:
      CAMERA_ANSWER: allow
- waitForAnimationToEnd:
    timeout: 5000
# The scanner either stays open (close it) or the fixture payload submits at once
# and the screen shows its outcome: the pending connection or a submit error.
# A scan button that does nothing fails here.
- runFlow:
    when:
      notVisible:
        id: student.professionals.qrCloseButton
    commands:
      - extendedWaitUntil:
          visible:
            id: "student\\.professionals\\.(?:connectionPending\\.e2e-pending-nutritionist-connection|submitError)"
          timeout: 10000
- runFlow:
    when:
      visible:
        id: student.professionals.qrCloseButton
    commands:
      - tapOn:
          id: student.professionals.qrCloseButton
- extendedWaitUntil:
    visible:
      id: student.professionals.screen
    timeout: 5000
