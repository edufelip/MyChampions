appId: com.edufelip.mychampions.dev
name: Custom meal library - validates and logs a custom meal portion from the quick log panel
tags: [nutrition]
---
- runFlow: ../common/student-open-meal-library.yaml
- extendedWaitUntil:
    visible:
      id: meal.library.row.e2e-custom-meal.log
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: meal.library.row.e2e-custom-meal.log
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: meal.library.quickLog.panel
    timeout: 5000
- tapOn:
    id: meal.library.quickLog.cta.confirm
- extendedWaitUntil:
    visible:
      id: meal.library.quickLog.error
    timeout: 5000
- tapOn:
    id: meal.library.quickLog.input
- inputText: "150"
# Check the value once the keyboard is closed: on Android 15+ (edge-to-edge)
# the keyboard covers the panel's input (recorded product finding).
- runFlow:
    file: ../common/hide-keyboard.yaml
    env:
      IOS_KEYBOARD: done
- assertVisible:
    id: meal.library.quickLog.input
    text: "150"
- tapOn:
    id: meal.library.quickLog.cta.confirm
- extendedWaitUntil:
    notVisible:
      id: meal.library.quickLog.panel
    timeout: 10000
