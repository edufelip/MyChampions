appId: com.edufelip.mychampions.dev
name: Custom meal library - validates and logs a custom meal portion from the quick log panel
tags: [nutrition]
---
- runFlow: ../common/student-open-meal-library.yaml
- extendedWaitUntil:
    visible:
      id: meal.library.row.e2e-custom-meal.log
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: meal.library.row.e2e-custom-meal.log
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: meal.library.quickLog.panel
    timeout: 5000
- tapOn:
    id: meal.library.quickLog.cta.confirm
- extendedWaitUntil:
    visible:
      id: meal.library.quickLog.error
    timeout: 5000
- tapOn:
    id: meal.library.quickLog.input
- inputText: "150"
- assertVisible:
    id: meal.library.quickLog.input
    text: "150"
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      KEYBOARD_DONE_ID: meal.library.quickLog.keyboard.done
- tapOn:
    id: meal.library.quickLog.cta.confirm
- extendedWaitUntil:
    notVisible:
      id: meal.library.quickLog.panel
    timeout: 10000
