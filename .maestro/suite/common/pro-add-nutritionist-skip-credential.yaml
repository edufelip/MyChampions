# On specialty setup: add Nutritionist and skip its credential form.
appId: com.edufelip.mychampions.dev
---
- extendedWaitUntil:
    visible:
      id: pro.specialty.empty
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: pro.specialty.add.nutritionist
    timeout: 5000
- tapOn:
    id: pro.specialty.add.nutritionist
- extendedWaitUntil:
    visible:
      id: pro.specialty.credentialForm
    timeout: 5000
- scrollUntilVisible:
    element:
      id: pro.specialty.credential.skip
    direction: DOWN
- tapOn:
    id: pro.specialty.credential.skip
- extendedWaitUntil:
    visible:
      id: pro.specialty.row.nutritionist
    timeout: 5000
