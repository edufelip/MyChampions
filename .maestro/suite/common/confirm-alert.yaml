# Tap the BUTTON action of a native two-button alert (BUTTON beside Cancel).
# On iOS the title, the alert body and other controls (e.g. a trash icon
# labelled "Delete") can share the text, so pick the match right of Cancel.
appId: com.edufelip.mychampions.dev
---
- extendedWaitUntil:
    visible:
      text: ${BUTTON}
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: ${BUTTON}
          rightOf: "^Cancel$"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: android:id/button1
