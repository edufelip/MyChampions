# After a credential submit the OS may offer to save the password (iOS
# "Save Password?", Android password manager). Wait briefly for it and decline.
# The screen is changing here, so the visibility check is retried: an iOS
# hierarchy query can fail while views are torn down.
appId: com.edufelip.mychampions.dev
---
- extendedWaitUntil:
    visible: "(?i)^not now$"
    timeout: ${PASSWORD_SHEET_WAIT_MS || 8000}
    optional: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "(?i)^not now$"
          commands:
            - tapOn: "(?i)^not now$"
            - extendedWaitUntil:
                notVisible: "(?i)^not now$"
                timeout: 10000
