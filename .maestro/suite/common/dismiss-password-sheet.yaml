# After a credential submit the OS may offer to save the password (iOS
# "Save Password?", Android password manager). Wait briefly for it and decline.
appId: com.edufelip.mychampions.dev
---
- extendedWaitUntil:
    visible: "(?i)^not now$"
    timeout: ${PASSWORD_SHEET_WAIT_MS || 8000}
    optional: true
- runFlow:
    when:
      visible: "(?i)^not now$"
    commands:
      - tapOn: "(?i)^not now$"
      - extendedWaitUntil:
          notVisible: "(?i)^not now$"
          timeout: 10000
