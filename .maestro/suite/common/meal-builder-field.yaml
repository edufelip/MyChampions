# Fill one custom-meal builder field (FIELD, VALUE).
appId: com.edufelip.mychampions.dev
---
- scrollUntilVisible:
    element:
      id: meal.builder.field.${FIELD}.input
    direction: DOWN
- tapOn:
    id: meal.builder.field.${FIELD}.input
- inputText: ${VALUE}
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      KEYBOARD_DONE_ID: meal.builder.keyboard.done
