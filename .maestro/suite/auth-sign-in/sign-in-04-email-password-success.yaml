appId: com.edufelip.mychampions.dev
name: Auth sign-in - navigates to role-selection after successful sign-in
tags: [auth-entry]
---
- runFlow: ../common/launch-fresh.yaml
- runFlow: ../common/wait-sign-in.yaml
- tapOn:
    id: auth.signIn.emailInput
- inputText: e2e-auth-session@example.test
- tapOn:
    id: auth.signIn.passwordInput
- inputText: E2E-password-123!
- hideKeyboard
- tapOn:
    id: auth.signIn.submitButton
- extendedWaitUntil:
    visible:
      id: auth.roleSelection.title
    timeout: 10000
