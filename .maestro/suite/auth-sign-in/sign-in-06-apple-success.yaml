appId: com.edufelip.mychampions.dev
name: Auth sign-in - navigates to role-selection after successful Apple sign-in
tags: [auth-entry]
---
- runFlow: ../common/launch-fresh.yaml
- runFlow: ../common/wait-sign-in.yaml
- scrollUntilVisible:
    element:
      id: auth.signIn.appleButton
    direction: DOWN
- tapOn:
    id: auth.signIn.appleButton
- extendedWaitUntil:
    visible:
      id: auth.roleSelection.title
    timeout: 10000
