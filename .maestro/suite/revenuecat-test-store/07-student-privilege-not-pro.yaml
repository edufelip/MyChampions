appId: com.edufelip.mychampions.dev
name: RevenueCat live - does not let the student privilege unlock professional capabilities
tags: [professional-regression]
---
- runFlow: steps/launch-pro-subscription.yaml
- runFlow:
    file: steps/pro-status.yaml
    env:
      STATUS: Active
      TIMEOUT: 20000
- runFlow: steps/sign-out.yaml
- runFlow: steps/create-student-account.yaml
- runFlow:
    file: steps/select-role.yaml
    env:
      ROLE: student
- runFlow: steps/student-open-ai-gate.yaml
- runFlow: steps/student-ai-locked.yaml
- runFlow:
    file: steps/open-test-store-purchase.yaml
    env:
      SOURCE_CTA: meal.photoAnalysis.paywall.cta
      ROLE: student
      INTERVAL: monthly
- tapOn: Test valid purchase
- runFlow:
    file: steps/student-ai-active.yaml
    env:
      TIMEOUT: 20000
- takeScreenshot: revenuecat-live-student-active
- runFlow: steps/sign-out.yaml
- runFlow: steps/sign-in-created.yaml
- runFlow: steps/pro-open-subscription.yaml
- runFlow:
    file: steps/pro-status.yaml
    env:
      STATUS: Inactive
      TIMEOUT: 20000
- takeScreenshot: revenuecat-live-student-professional-inactive
