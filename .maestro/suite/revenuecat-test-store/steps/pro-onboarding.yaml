appId: com.edufelip.mychampions.dev
---
- runFlow:
    file: select-role.yaml
    env:
      ROLE: professional
- extendedWaitUntil:
    visible:
      id: pro.specialty.cta_skip
    timeout: 5000
- tapOn:
    id: pro.specialty.cta_skip
- extendedWaitUntil:
    visible:
      id: pro.home.screen
    timeout: 10000
