appId: com.edufelip.mychampions.dev
name: RevenueCat live - propagates Professional Paywall v1 and keeps a dismissed purchase inactive
tags: [professional-regression]
---
- runFlow: steps/launch-pro-subscription.yaml
- runFlow:
    file: steps/pro-status.yaml
    env:
      STATUS: Inactive
      TIMEOUT: 15000
- tapOn:
    id: pro.subscription.purchaseCta
- runFlow:
    file: steps/paywall-contract.yaml
    env:
      ROLE: professional
- takeScreenshot: revenuecat-live-professional-paywall-v1
- runFlow:
    file: steps/dismiss-paywall.yaml
    env:
      ROLE: professional
      RETURN_ID: pro.subscription.screen
- runFlow:
    file: steps/pro-status.yaml
    env:
      STATUS: Inactive
      TIMEOUT: 15000
- takeScreenshot: revenuecat-live-professional-paywall-v1-dismissed
